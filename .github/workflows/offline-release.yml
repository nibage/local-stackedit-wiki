name: Build complete offline wiki ZIP
on:
  # Build an offline ZIP automatically when sources change on main, as well as
  # on demand. A failed genuine renderer test never uploads an artifact.
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/offline-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unit tests
        run: |
          node --test tests/*.test.cjs
          python tests/offline-release-build.test.py
      - name: Download and validate pinned renderers; build complete ZIP
        run: python tools/build-offline-release.py --output local-stackedit-wiki-offline.zip
      - name: Install Chromium for actual renderer smoke tests
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify bundled Mermaid and ABCjs render into SVG without network
        run: python tests/real-renderers-release-smoke.py --zip local-stackedit-wiki-offline.zip
      - name: Upload verified ZIP
        uses: actions/upload-artifact@v4
        with:
          name: local-stackedit-wiki-offline
          path: local-stackedit-wiki-offline.zip
          if-no-files-found: error
