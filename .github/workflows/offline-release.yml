name: Build complete offline wiki ZIP
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unit tests
        run: |
          node --test tests/*.test.cjs
          python tests/offline-release-build.test.py
          python tests/windows-path-portability.test.py
          python tests/demo-english-paths.test.py
      - name: Download and validate pinned renderers; build complete ZIP
        run: python tools/build-offline-release.py --output local-stackedit-wiki-offline.zip
      - name: Install Chromium for actual renderer smoke tests
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify bundled Mermaid and ABCjs render into SVG without network
        run: python tests/real-renderers-release-smoke.py --zip local-stackedit-wiki-offline.zip
      - name: Verify nonempty Canvas/SVG/draw.io export and unclipped A4 print geometry
        run: python tests/preview-export-visuals-ui-smoke.py
      - name: Verify real asynchronous Canvas/Bases/draw.io HTML and PDF exports with linked Contents
        run: python tests/structured-export-real-ui-smoke.py
      - name: Verify condensed Canvas toolbar, inline discard, inspector and selection toggle
        run: python tests/canvas-editor-compact-ui-smoke.py
      - name: Capture current dark-mode screenshot from real offline app
        run: python tests/marketing-screenshot.py --zip local-stackedit-wiki-offline.zip --out marketing-current.jpg
      - name: Verify workspace layout, sidebar resizing and theme colors
        run: python tests/rc3-layout-storage-smoke.py
      - name: Verify RC5 English UI, drag-and-drop safety, inline creation, images and palettes
        run: python tests/rc5-ui-smoke.py
      - name: Verify binary image moves and updated links
        run: python tests/rc52-image-ui-smoke.py
      - name: Verify Obsidian attachments, previews, SVG isolation and binary media moves
        run: python tests/obsidian-attachments-ui-smoke.py
      - name: Verify quick root-note creation, responsive sidebar/footer and StackEdit HTML fidelity
        run: python tests/quick-note-sidebar-stackedit-ui-smoke.py
      - name: Verify tree controls, status layout and 5-second autosave
        run: python tests/tree-autosave-ui-smoke.py
      - name: Verify live preview scroll, selected tree reveal and favicon
        run: python tests/preview-navigation-ui-smoke.py
      - name: Verify safe navigation autosave and themed delete modal
        run: python tests/navigation-save-delete-ui-smoke.py
      - name: Verify scrollable tree, stable Move button and responsive sidebar
        run: python tests/tree-layout-scroll-ui-smoke.py
      - name: Verify Back navigation, expanded tree paths and manual/auto 3-second preview refresh
        run: python tests/auto-rerender-navigation-ui-smoke.py
      - name: Verify Links navigation, Refresh tree state, status popups and diagnostics
        run: python tests/links-refresh-ui-smoke.py
      - name: Verify folder moves and opt-in trash button
        run: python tests/folder-move-ui-smoke.py
      - name: Verify offline draw.io XML, compressed pages and safe SVG rendering
        run: python tests/drawio-ui-smoke.py
      - name: Verify Canvas editor Save, Undo/Redo, discard and external conflict
        run: python tests/canvas-editor-ui-smoke.py
      - name: Verify Canvas pointer dragging, live arrows and resize handles
        run: python tests/canvas-drag-ui-smoke.py
      - name: Verify temporary Bases filters, sorting and column resizing
        run: python tests/bases-interaction-ui-smoke.py
      - name: Verify guarded Base YAML editor and conflict handling
        run: python tests/bases-editor-ui-smoke.py
      - name: Verify TOC view preservation and Center/Line numbers/Text size display settings
        run: python tests/toc-display-settings-ui-smoke.py
      - name: Verify index.md auto-open, empty wiki, stable Scroll sync and MathJax alignment
        run: python tests/index-math-scroll-ui-smoke.py
      - name: Verify compact header, centered themes, statistics and bidirectional scroll sync
        run: python tests/compact-workspace-ui-smoke.py
      - name: Verify StackEdit reading theme and expanded Markdown/media toolbar
        run: python tests/stackedit-theme-toolbar-ui-smoke.py
      - name: Verify green layout choice and self-contained HTML/PDF preview export
        run: python tests/preview-export-ui-smoke.py
      - name: Upload verified ZIP
        uses: actions/upload-artifact@v4
        with:
          name: local-stackedit-wiki-offline
          path: local-stackedit-wiki-offline.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download tested release archive
        uses: actions/download-artifact@v4
        with:
          name: local-stackedit-wiki-offline
      - name: Publish permanent ZIP to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" local-stackedit-wiki-offline.zip --verify-tag --generate-notes
